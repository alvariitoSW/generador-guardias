databases:
  - name: generador-guardias-db
    databaseName: guardias
    user: guardias
    plan: free

services:
  - type: web
    name: generador-guardias-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: generador-guardias-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # La URL real del frontend puede llevar un sufijo que pone Render
      # (p.ej. -9f7d), así que no se fija aquí. La API usa token Bearer.
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: generador-guardias-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Host real del backend (incluido el sufijo que añada Render); el
      # frontend le añade https:// y /api.
      - key: VITE_API_URL
        fromService:
          type: web
          name: generador-guardias-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
